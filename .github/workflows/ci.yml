name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: lint + tests
    runs-on: ubuntu-latest
    env:
      # core.config veri kökünü içe aktarma anında ister ve tanımlı değilse
      # bilerek hata fırlatır (sessiz varsayılan yok). CI'da .env bulunmadığı
      # için burada geçici bir kök verilir; testler zaten tmp_path kullanır.
      OTOMASYON_DATA_ROOT: ${{ runner.temp }}/otomasyon-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  remotion:
    name: video templates typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
